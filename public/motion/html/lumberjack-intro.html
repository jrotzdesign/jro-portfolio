<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Lumberjack — Intro Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600&display=swap" rel="stylesheet">
<style>
:root{--white:#fffdf9;--ink-soft:#77705f}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EB Garamond',Georgia,serif;background:var(--white);min-height:100vh}

/* ===== landing intro: SVG tree, ribbon wraps segment by segment, true-logo swap — once per session ===== */
#intro{position:fixed;inset:0;z-index:999;pointer-events:none;overflow:hidden}
#intro .panel{position:absolute;inset:0;will-change:transform;
  animation:swipeUp .8s cubic-bezier(.76,0,.24,1) forwards}
#intro .panel--dark{background:#6e2114;animation-delay:4.09s}
#intro .panel--red{background:#ab3719;animation-delay:3.97s}
#intro .panel--cream{background:var(--white);animation-delay:3.85s;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px}
@keyframes swipeUp{to{transform:translateY(-102%)}}
#intro .stage{position:relative;height:232px;width:113px;transform-origin:50% 96%;
  animation:staSway 1.5s cubic-bezier(.45,.05,.55,.95) 2.05s}
#intro .stage img{position:absolute;inset:0;width:100%;height:100%}
#intro img.solid{animation:treeIn 1.05s cubic-bezier(.22,1,.36,1) both}
#intro img.seg1{opacity:0;clip-path:inset(-6% -8% 106% -8%);animation:segWipe1 0.34s cubic-bezier(.6,.05,.15,1) 0.55s forwards}
@keyframes segWipe1{0%{opacity:1;clip-path:inset(-6% -8% 106% -8%)}100%{opacity:1;clip-path:inset(-6% -8% -6% -8%)}}
#intro img.seg2{opacity:0;clip-path:inset(-6% 106% -6% -6%);animation:segWipe2 0.34s cubic-bezier(.6,.05,.15,1) 0.77s forwards}
@keyframes segWipe2{0%{opacity:1;clip-path:inset(-6% 106% -6% -6%)}100%{opacity:1;clip-path:inset(-6% -8% -6% -6%)}}
#intro img.seg3{opacity:0;clip-path:inset(-6% -8% 106% -8%);animation:segWipe3 0.34s cubic-bezier(.6,.05,.15,1) 0.99s forwards}
@keyframes segWipe3{0%{opacity:1;clip-path:inset(-6% -8% 106% -8%)}100%{opacity:1;clip-path:inset(-6% -8% -6% -8%)}}
#intro img.star{opacity:0;transform:scale(.2);transform-origin:50% 8%;
  animation:starPop .6s cubic-bezier(.34,1.4,.64,1) 1.85s forwards}
@keyframes treeIn{from{opacity:0;transform:translateY(26px) scale(.72)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes starPop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
@keyframes staSway{0%{rotate:0deg}30%{rotate:-2.6deg}65%{rotate:1.8deg}100%{rotate:0deg}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
#intro .w{font-family:'Lobster Two',cursive;font-style:italic;font-weight:700;font-size:39px;color:#49260e;display:flex}
#intro .w span{opacity:0;display:inline-block;transform:translateY(16px) rotate(3deg);filter:blur(4px);
  animation:chIn .65s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(2.3s + var(--i) * .042s)}
#intro .tag{font-size:12.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);display:flex}
#intro .tag span{opacity:0;display:inline-block;transform:translateY(7px);
  animation:chIn .55s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(2.85s + var(--i) * .02s)}
@keyframes chIn{to{opacity:1;transform:none;filter:blur(0)}}
@media (prefers-reduced-motion: reduce){#intro{display:none}}
/* dev-only replay button — remove before production */
#replayIntro{position:fixed;right:18px;bottom:18px;z-index:1000;font-family:'EB Garamond',serif;
  font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);
  background:var(--white);border:1px solid var(--ink);border-radius:999px;padding:10px 18px;cursor:pointer}
#replayIntro:hover{background:var(--beige)}

/* end card revealed behind the curtains */
.endcard{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--white)}
.endcard img.logo{height:190px}
.endcard .tag2{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft)}
.endcard button{margin-top:26px;font-family:'EB Garamond',serif;font-size:12px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:#221d17;background:var(--white);border:1px solid #221d17;border-radius:999px;
  padding:12px 26px;cursor:pointer}
.endcard button:hover{background:#f4eee2}
.note{position:fixed;left:18px;bottom:14px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#b5ad9d}
#replayIntro,.note,.endcard button{display:none!important}html,body{overflow:hidden}
</style>
</head>

<button id="replayIntro" type="button" title="Dev only — replays the landing animation">Replay intro</button>
<script>
(function(){
  // embed build for the portfolio: plays, rests on the end card, plays again; the parent card can restart it
  var intro = document.getElementById('intro');
  var introHTML = intro.outerHTML, t1 = 0, t2 = 0;
  function cycle(){
    clearTimeout(t1); clearTimeout(t2);
    var cur = document.getElementById('intro'); if (cur) cur.remove();
    document.body.insertAdjacentHTML('afterbegin', introHTML);
    t1 = setTimeout(function(){ var c = document.getElementById('intro'); if (c) c.remove(); }, 5100);
    t2 = setTimeout(cycle, 5100 + 2600);
  }
  t1 = setTimeout(function(){ var c = document.getElementById('intro'); if (c) c.remove(); }, 5100);
  t2 = setTimeout(cycle, 5100 + 2600);
  addEventListener('message', function(e){ if (e.data === 'restart') cycle(); });
})();
</script>
